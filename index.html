<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6fa;color:#171923}
header{background:#171821;color:white;padding:34px 28px 28px}h1{margin:0 0 8px;font-size:36px}header p{margin:0;font-size:18px;color:#c9cad3}
.wrap{max-width:900px;margin:28px auto;padding:0 18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid #e2e3e8;border-radius:22px;padding:24px}.num{font-size:44px;font-weight:750}.label{color:#687080;font-size:17px;margin-top:4px}
.controls{display:flex;gap:12px;margin:20px 0}.search{flex:1;padding:17px;border:1px solid #dddfe6;border-radius:16px;font-size:16px}.btn{border:0;border-radius:16px;padding:0 22px;background:white;font-weight:700;font-size:16px}
.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tab{border:0;border-radius:12px;padding:11px 18px;background:#e8e9ee;font-weight:700}.tab.active{background:#171821;color:white}
.topic{display:flex;align-items:center;gap:14px;background:white;border:1px solid #e1e2e7;border-radius:16px;padding:16px;margin:10px 0}.topic input{width:22px;height:22px}.topic small{display:block;color:#737988;margin-top:3px}.done{text-decoration:line-through;opacity:.55}
@media(max-width:600px){.stats{gap:10px}.card{padding:18px}.num{font-size:34px}.controls{flex-wrap:wrap}.search{min-width:100%;height:52px}.btn{height:52px}}
</style>
</head>
<body>
<header><h1>🏅 Gold Tracker</h1><p>Pathology • Pharmacology • Microbiology | Path exam 14 Sep • University 16 Sep</p></header>
<div class="wrap">
<div class="stats">
<div class="card"><div class="num" id="shown">0</div><div class="label">Topics shown</div></div>
<div class="card"><div class="num" id="completed">0</div><div class="label">Completed</div></div>
<div class="card"><div class="num" id="progress">0%</div><div class="label">Progress</div></div>
<div class="card"><div class="num" id="revisions">0</div><div class="label">Revisions logged</div></div>
</div>
<div class="controls"><input id="search" class="search" placeholder="Search topic..."><button class="btn" onclick="logRevision()">📅 Log revision</button><button class="btn" onclick="resetAll()">Reset</button></div>
<div class="tabs" id="tabs"></div><div id="list"></div>
</div>
<script>
const data={
Pathology:["General pathology","Hematology","RBC disorders","WBC disorders","Platelets & coagulation","CVS pathology","Respiratory pathology","GIT & hepatobiliary","Renal pathology","Skin & soft tissue"],
Pharmacology:["General pharmacology","ANS","CVS drugs","Blood drugs","CNS","Autacoids","Endocrine","Chemotherapy","Antimicrobial drugs","TB & malaria drugs"],
Microbiology:["General microbiology","Immunity","Bacteriology","Virology","Parasitology","Mycology","Blood & CVS infections","Respiratory infections","Hepatobiliary & urinary infections","Genital infections"]
};
let subject=localStorage.subject||"Pathology", done=JSON.parse(localStorage.done||"{}"), rev=+localStorage.rev||0;
function save(){localStorage.subject=subject;localStorage.done=JSON.stringify(done);localStorage.rev=rev}
function render(){
document.querySelector("#tabs").innerHTML=Object.keys(data).map(s=>`<button class="tab ${s==subject?"active":""}" onclick="subject='${s}';save();render()">${s}</button>`).join("");
let q=document.querySelector("#search").value.toLowerCase(), arr=data[subject].filter(x=>x.toLowerCase().includes(q));
document.querySelector("#list").innerHTML=arr.map((x,i)=>{let k=subject+"-"+x;return `<div class="topic"><input type="checkbox" ${done[k]?"checked":""} onchange="done['${k}']=this.checked;save();render()"><div class="${done[k]?"done":""}"><b>${x}</b><small>${subject}</small></div></div>`}).join("");
let all=Object.entries(data).flatMap(([s,a])=>a.map(x=>s+"-"+x)), c=all.filter(k=>done[k]).length;
document.querySelector("#shown").textContent=arr.length;document.querySelector("#completed").textContent=c;document.querySelector("#progress").textContent=Math.round(c/all.length*100)+"%";document.querySelector("#revisions").textContent=rev;
}
function logRevision(){rev++;save();render()} function resetAll(){if(confirm("Reset all progress?")){done={};rev=0;save();render()}}
document.querySelector("#search").oninput=render;render();
</script>
</body>
</html>
